services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    container_name: course_sqlserver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend/CourseVideo.API
    container_name: course_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      CONNECTION_STRING: ${CONNECTION_STRING}
      AI_WORKER_BASE_URL: ${AI_WORKER_BASE_URL}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: course_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    volumes:
      - ./storage:/usr/share/nginx/storage:ro

  ai-worker:
    build:
      context: ./ai-worker
    container_name: course_ai_worker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AI_WORKER_PORT}:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./ai-worker/app/phobert_dataset2_model:/app/app/phobert_dataset2_model:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  sqlserver_data:
